name: checks

# The house rules and the book-level consistency checks need nothing but a
# Python interpreter, so they run on every push and on every pull request.
# Building the book itself needs a TeX installation and is done locally, so
# the Markdown check regenerates the chapters only, not the figures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House rules over every chapter
        run: python lint.py

      - name: Book-level consistency
        run: python crosscheck.py

      - name: Every chapter has its five figures and a project line
        run: |
          set -e
          fail=0
          for n in $(seq -w 1 20); do
            test -f "sections/c${n}.tex" || { echo "missing sections/c${n}.tex"; fail=1; }
            grep -q 'project{' "sections/c${n}.tex" || { echo "c${n}: no project line"; fail=1; }
            for f in arch wiring uml mem timing; do
              test -f "figures/c${n}_${f}.tex" || { echo "missing figures/c${n}_${f}.tex"; fail=1; }
            done
          done
          test -f sections/front.tex
          test -f sections/appendix.tex
          test -f figures/front_map.tex
          exit $fail

      - name: The Markdown edition is in step with the source
        run: |
          set -e
          python mdbuild.py >/dev/null
          if ! git diff --quiet -- chapters; then
            echo "chapters/ is behind sections/; run python mdbuild.py and commit"
            git --no-pager diff --stat -- chapters
            exit 1
          fi
          echo "chapters/ matches sections/"

      - name: Every relative link resolves
        run: python python/tools/check_links.py

      # Each project states its state per language in one line, and this refuses
      # if that line, the code on disk and the table in projects/README.md do not
      # agree. It also refuses if any Markdown under projects/ names a repository
      # path that does not exist, which is how three references to a C++ header
      # that had never had that name stayed in the tree.
      - name: Every project's state agrees with its code and with the table
        run: python python/tools/check_status.py

      # Added on Sunday 4 October 2026. Half of this suite's code paths cannot
      # run on the laptop that writes them, because compiling there is
      # forbidden, so a branch that drives a compiled filter is dead there and a
      # name error inside it passes. One did, in P06's parity test, and it
      # surfaced only on the first laptop that had all four implementations.
      # An undefined name needs nothing run to find it, so it is checked here.
      - name: Every name the Python reads is bound by something
        run: python python/tools/check_names.py

      # The C counterpart of the check above, and added for the same reason on
      # Sunday 4 October 2026: a helper in c/board/clock280.c was placed above
      # the two functions it calls, which is an implicit declaration and three
      # errors under this repository's warning set. Nothing on the authoring
      # laptop could have seen it, because compiling there is forbidden, so the
      # C is written where it is never compiled. This needs no compiler.
      - name: Every static C function is defined before it is called
        run: python python/tools/check_c_order.py

      # The third of the same family, added Tuesday 6 October 2026 for the same
      # reason as the two above and after the same kind of round trip. A struct
      # carrying a bool went into c/instr/freqcount.h, which included stdint.h
      # and not stdbool.h. Every check on the authoring laptop passed, because
      # none of them compiles, and gcc 15 in WSL refused the file one push
      # later. A header has to be self contained: inheriting a type from
      # whatever included it first works until something includes that header
      # first. This needs no compiler either.
      - name: Every C header includes what its own declarations use
        run: python python/tools/check_c_includes.py

      # The fourth of the family, and the one that guards the worst defect this
      # project has produced: six arguments into a five placeholder format
      # string, which three implementations then agreed about while all three
      # were wrong. gcc's -Wformat catches the C side, but only where a compiler
      # runs, and this file's report text is rewritten often enough that the
      # check was run by hand four times on Tuesday 6 October 2026 before it was
      # made a tool. A mismatch prints a wrong number that reads as a
      # measurement.
      - name: Every printf format matches its argument count
        run: python python/tools/check_printf_args.py

      - name: No assembled volume and no PDF is published
        run: |
          set -e
          if git ls-files | grep -E '\.(pdf|html|aux|log|toc|out)$'; then
            echo "A PDF or an HTML file is committed, and neither is ever published."
            echo "What this repository offers is one Markdown chapter and one project"
            echo "at a time, which is what mdbuild.py writes. There is deliberately no"
            echo "assembled volume to download. The PDF and the HTML are for the"
            echo "author's own proofreading and stay on the authoring machine."
            exit 1
          fi
          echo "no PDF, no HTML, no assembled volume. Markdown chapters only, as intended"

      - name: No journal and no correspondence is published
        run: |
          set -e
          if git ls-files | grep -iE '(^|/)(private_journal|correspondence)/|(^|/)DIARY[^/]*\.md$'; then
            echo "A journal or a correspondence file is committed."
            echo "These live in the catalogue, which is local only. A published"
            echo "repository carries the work, never the running record of doing it."
            exit 1
          fi
          echo "no journal, no correspondence, as intended"
