name: code

# The whole point of this repository is that it runs with no hardware, so the
# runner is a fair test of it rather than a reduced one. If something here needs
# the NUCLEO-H7A3ZI-Q, a Raspberry Pi, a DAQ HAT or a power instrument, it is in
# the wrong half of the project and belongs behind a command the suite does not
# call.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from requirements.txt, and deliberately not the hardware one
        run: python -m pip install --quiet -r requirements.txt

      # The generated files are committed so a fresh clone builds without the
      # generator. This fails the build when they have drifted, so a field width
      # cannot be changed in P09's specification and merged half-applied.
      - name: P09's generated files match its specification
        run: |
          python python/tools/gen_codec.py projects/P09-payload-codec/fields.py \
            --out-c c/payload --out-py python/firmkit --check

      - name: Build everything the suite needs
        run: python python/tools/build_host.py

      # Warnings as errors, separately, because build_host.py deliberately does
      # not use -Werror: a warning should not stop somebody working locally, and
      # it should stop a merge.
      - name: The same sources with warnings as errors
        run: |
          set -e
          W="-Wall -Wextra -Wshadow -Wconversion -Wsign-conversion -Wdouble-promotion -Wpedantic -Werror"
          mkdir -p build-host/werror
          gcc -std=c11 -O2 $W -Ic/payload -c c/payload/payload.c -o build-host/werror/payload.o
          gcc -std=c11 -O2 $W -Ic/ring -c c/ring/ring.c -o build-host/werror/ring.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti \
            -Ic/payload -Icpp/P09 \
            -c projects/P09-payload-codec/cpp/cpp_encode_only.cpp -o build-host/werror/cpp.o

      - name: P09, the golden vectors
        run: python -m pytest python/tests/test_vectors.py -q

      - name: P09, the round trip over 100000 cases with a recorded seed
        run: python -m pytest python/tests/test_roundtrip.py -q -s

      - name: P09, the C++ variant against the C one over the whole run
        run: python -m pytest python/tests/test_cpp.py -q

      - name: P09, the twin stays inside the MicroPython subset
        run: python -m pytest python/tests/test_micropython_subset.py -q

      - name: P02, the ring in all four ordering modes
        run: python -m pytest python/tests/test_ring.py -q -s

      - name: P06, the witness analysis on synthetic input
        run: python -m pytest python/tests/test_rate.py -q

      - name: P08, every transition row reachable
        run: python -m pytest python/tests/test_node_sm.py -q -s

      - name: P05, the frame rejects every single-bit corruption
        run: python -m pytest python/tests/test_frame.py -q

      - name: P03, every lost byte attributed to the target or the bridge
        run: python -m pytest python/tests/test_report.py -q

      # Gate 1 of P12's three gates is every step above: host tests on a runner
      # with no board. This is gate 2 and gate 3 proving they can fail.
      - name: P12, the size and charge gates refuse what they must
        run: python -m pytest python/tests/test_gates.py -q

      - name: What CBOR would have cost P09, measured
        run: cd python && python -m firmkit.cbor

      - name: Object sizes, published and never ranked
        run: size build-host/payload_c.o build-host/payload_cpp.o build-host/ring_c.o

  # A second job with a seed nobody chose. It prints the seed before doing any
  # work, so a failure here is reproducible from the log.
  random-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python python/tools/build_host.py
      - name: P09's round trip with a random seed, printed
        run: python -m pytest python/tests/test_roundtrip.py::test_roundtrip_random_seed -q -s
