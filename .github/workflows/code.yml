name: code

# The whole point of this repository is that it runs with no hardware, so the
# runner is a fair test of it rather than a reduced one. If something here needs
# the NUCLEO-H7A3ZI-Q, a Raspberry Pi, a DAQ HAT or a power instrument, it is in
# the wrong half of the project and belongs behind a command the suite does not
# call.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from requirements.txt, and deliberately not the hardware one
        run: python -m pip install --quiet -r requirements.txt

      # The generated files are committed so a fresh clone builds without the
      # generator. This fails the build when they have drifted, so a field width
      # cannot be changed in P09's specification and merged half-applied.
      - name: P09's generated files match its specification
        run: |
          python python/tools/gen_codec.py projects/P09-payload-codec/fields.py \
            --out-c c/payload --out-py python/firmkit \
            --out-rs projects/P09-payload-codec/rust/src --check

      # Before the build and not after, because that is the point of it. Every
      # path build_host.py names is checked without a compiler, so a project key
      # or a source filename that is wrong is a message here rather than a
      # traceback part way through a build. It is in the suite because
      # build_host.py is the one script never run on the authoring laptop, which
      # is how P06's missing project key survived to WSL on Sunday
      # 4 October 2026.
      - name: Every path build_host.py names, before it builds anything
        run: python -m pytest python/tests/test_build_host_paths.py -q -s

      - name: Build everything the suite needs
        run: python python/tools/build_host.py

      # Warnings as errors, separately, because build_host.py deliberately does
      # not use -Werror: a warning should not stop somebody working locally, and
      # it should stop a merge.
      - name: The same sources with warnings as errors
        run: |
          set -e
          W="-Wall -Wextra -Wshadow -Wconversion -Wsign-conversion -Wdouble-promotion -Wpedantic -Werror"
          mkdir -p build-host/werror
          gcc -std=c11 -O2 $W -Ic/payload -c c/payload/payload.c -o build-host/werror/payload.o
          gcc -std=c11 -O2 $W -Ic/ring -c c/ring/ring.c -o build-host/werror/ring.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti \
            -Ic/payload -Iprojects/P09-payload-codec/cpp \
            -c projects/P09-payload-codec/cpp/cpp_encode_only.cpp -o build-host/werror/cpp.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti \
            -Iprojects/P05-framing-crc/cpp \
            -c projects/P05-framing-crc/cpp/frame_filter.cpp -o build-host/werror/p05_cpp.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti \
            -Iprojects/P08-node-state-machine/cpp -Iprojects/P09-payload-codec/cpp \
            -c projects/P08-node-state-machine/cpp/node_sm_filter.cpp -o build-host/werror/p08_cpp.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti \
            -Iprojects/P02-ring-buffer/cpp \
            -c projects/P02-ring-buffer/cpp/ring_filter.cpp -o build-host/werror/p02_cpp.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti \
            -Iprojects/P03-interrupt-receive/cpp \
            -c projects/P03-interrupt-receive/cpp/attribute_filter.cpp -o build-host/werror/p03_cpp.o
          gcc -std=c11 -O2 $W -Iprojects/P03-interrupt-receive/c \
            -c projects/P03-interrupt-receive/c/attribute.c -o build-host/werror/p03_c.o
          # -ffp-contract=off on both P06 files, for the comparison rather than
          # as a preference: the witness is floating point and the contraction
          # of a multiply and an add is not the same across gcc, g++ and rustc.
          gcc -std=c11 -O2 $W -ffp-contract=off -Iprojects/P06-timer-sampling/c \
            -c projects/P06-timer-sampling/c/rate.c -o build-host/werror/p06_c.o
          g++ -std=c++17 -O2 $W -fno-exceptions -fno-rtti -ffp-contract=off \
            -Iprojects/P06-timer-sampling/cpp \
            -c projects/P06-timer-sampling/cpp/rate_filter.cpp -o build-host/werror/p06_cpp.o

      - name: P09, the golden vectors
        run: python -m pytest python/tests/test_vectors.py -q

      - name: P09, the round trip over 100000 cases with a recorded seed
        run: python -m pytest python/tests/test_roundtrip.py -q -s

      - name: P09, the C++ variant against the C one over the whole run
        run: python -m pytest python/tests/test_cpp.py -q

      # The parity table is printed, which is why this step passes -s. A green
      # tick says the suite ran; the table says which of the four languages were
      # actually in the comparison, and that is the thing worth reading. Without
      # cargo on this runner it compares three and says so, and the rust job
      # below is the one that compares four.
      - name: P09, every language against one oracle
        run: python -m pytest python/tests/test_parity.py -q -s

      - name: P05, every language against the check value and the corruption set
        run: python -m pytest python/tests/test_frame_parity.py -q -s

      - name: P08, every language takes the same row for every event
        run: python -m pytest python/tests/test_node_sm_parity.py -q -s

      - name: P02, every language produces the same trace in all four modes
        run: python -m pytest python/tests/test_ring_parity.py -q -s

      - name: P03, every language attributes every lost byte the same way
        run: python -m pytest python/tests/test_attribute_parity.py -q -s

      - name: P06, every language reads the same rate from the same capture
        run: python -m pytest python/tests/test_rate_parity.py -q -s

      - name: P09, the twin stays inside the MicroPython subset
        run: python -m pytest python/tests/test_micropython_subset.py -q

      - name: P02, the ring in all four ordering modes
        run: python -m pytest python/tests/test_ring.py -q -s

      - name: P06, the witness analysis on synthetic input
        run: python -m pytest python/tests/test_rate.py -q

      - name: P08, every transition row reachable
        run: python -m pytest python/tests/test_node_sm.py -q -s

      - name: P05, the frame rejects every single-bit corruption
        run: python -m pytest python/tests/test_frame.py -q

      - name: P03, every lost byte attributed to the target or the bridge
        run: python -m pytest python/tests/test_report.py -q

      # Gate 1 of P12's three gates is every step above: host tests on a runner
      # with no board. This is gate 2 and gate 3 proving they can fail.
      - name: P12, the size and charge gates refuse what they must
        run: python -m pytest python/tests/test_gates.py -q

      - name: What CBOR would have cost P09, measured
        run: cd python && python -m firmkit.cbor

      - name: Object sizes, published and never ranked
        run: size build-host/payload_c.o build-host/payload_cpp.o build-host/ring_c.o

  # Rust, in its own job because it needs a toolchain the other two do not, and
  # pinned by rust-toolchain.toml so a figure attributed to Rust in this volume
  # names the compiler that produced it. The first test of any of this is still
  # WSL on the win11 skyhorizon demo laptop, bing@JPTOUPM678, not here.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No action and no curl: the repository pins the toolchain, so the first
      # cargo command installs exactly what rust-toolchain.toml names, and the
      # version is printed rather than assumed.
      - name: The toolchain this repository pins
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      # The lock file is committed so the dependency set is pinned rather than
      # resolved afresh. Without --locked cargo quietly rewrites a stale lock
      # and the build goes green, which is how the lock came to list only one of
      # the two crates for a whole commit on Saturday 3 October 2026. A pin that
      # is silently updated is not a pin, so this refuses instead.
      - name: The committed lock file is the one cargo would write
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Formatting, as written rather than as preferred
        run: cargo fmt --all --check

      - name: Clippy, with warnings as errors, the same bar the C has
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: The properties that need no oracle
        run: cargo test --workspace -- --nocapture

      # Built here so the parity step below can drive it. The release profile is
      # the one the board half will use: opt-level s, LTO, panic abort.
      - name: The filter, release profile
        run: cargo build --release --workspace

      # The library alone for the board's target. It links nothing yet: a binary
      # needs cortex-m-rt and a linker script, which is P01's Rust half and is
      # not written. Compiling the codec for the target is still worth a step,
      # because it is what proves the codec is genuinely no_std.
      # Every library EXCEPT p06-rate, named rather than globbed, and the
      # exception is a finding rather than an oversight. P06's witness is
      # floating point, and f64::sqrt lives in std and not in core: Rust's core
      # has no floating-point maths, because those functions live in the
      # platform's libm and core assumes no platform. A no_std version would
      # need the libm crate. The witness runs on a host and has no reason to run
      # on the board, so it is std and is omitted here.
      #
      # The C is different, and that is the point worth printing: rate.c
      # compiles unchanged for the target, because newlib provides sqrt. The
      # same program is portable to this part in C and is not in Rust without a
      # crate, which is a cost of the language in the direction people do not
      # usually expect.
      - name: Every no_std library compiles for the board's target
        run: |
          cargo build --release --target thumbv7em-none-eabihf --lib             -p p02-ring -p p03-attribute -p p05-frame -p p08-node-sm -p p09-payload

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python python/tools/build_host.py

      # The step that makes the four-language claim falsifiable. With cargo
      # present all four are in the comparison, and the test refuses a run where
      # fewer than three were, so a parity suite cannot pass by being empty.
      - name: All four languages against one oracle
        run: python -m pytest python/tests/test_parity.py -q -s

      - name: P05, all four languages against the check value and the corruption set
        run: python -m pytest python/tests/test_frame_parity.py -q -s

      - name: P08, all four tables row by row
        run: python -m pytest python/tests/test_node_sm_parity.py -q -s

      - name: P02, all four rings over one trace
        run: python -m pytest python/tests/test_ring_parity.py -q -s

      - name: P03, all four attributions over one step list
        run: python -m pytest python/tests/test_attribute_parity.py -q -s

      - name: P06, all four witnesses over one set of captures
        run: python -m pytest python/tests/test_rate_parity.py -q -s

  # A second job with a seed nobody chose. It prints the seed before doing any
  # work, so a failure here is reproducible from the log.
  random-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python python/tools/build_host.py
      - name: P09's round trip with a random seed, printed
        run: python -m pytest python/tests/test_roundtrip.py::test_roundtrip_random_seed -q -s
