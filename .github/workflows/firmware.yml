name: firmware

# WHERE THIS CAN AND CANNOT BE BUILT. win11 aquamarine has no cross toolchain and
# no ninja, and WSL 2 is enabled there with no distribution installed; an inventory
# on Friday 2 October 2026 confirmed it. win11 skyhorizon has all three inside
# STM32CubeIDE 2.2.0 and on no PATH. This job needs neither machine: the runner
# installs the toolchain, builds the firmware and uploads the .bin files.
#
# Flashing needs no tool on any machine, because the ST-LINK presents a mass
# storage disk, drive D: labelled NOD_H7A3ZIQ on skyhorizon, and a .bin copied
# onto it is programmed. So the whole path from source to a running board is:
# push, download the artefact, copy it onto the probe's disk.
#
# WHAT THIS JOB IS NOW FOR, which is not what it was for when it was written.
#
# It used to say that nothing in this repository had ever been cross-compiled and
# that the first run was expected to fail. Both were true until Friday 2 October
# 2026. Five targets now build clean with zero warnings on win11 skyhorizon, and
# P01 runs on the board.
#
# So this job's value has changed from discovery to regression. It is the only
# build that happens on a machine nobody has configured by hand, which makes it
# the check on whether the build still stands up without CubeIDE's bundled
# toolchain, its exact gcc version, and whatever is cached in build-fw. A build
# that works only on the one laptop that has been coaxed into it is not a build.
#
# Read the log rather than trusting a README. Several statements in this
# repository about what compiles were correct when written and wrong a day later,
# and the state table in projects/README.md now distinguishes code that runs on
# the board from code that merely links, because that distinction turned out to
# matter.
#
# What is built and what is not:
#   p01-first-light   P01, blinks on the reset clock using only settled facts
#   p09-codec         P09's codec on the target, checking the negative vector
#   P06's three       NOT built here. They include stm32h7xx.h, the vendor device
#                     header, which this repository deliberately does not vendor
#                     because that pack's licence differs file by file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc-arm-none-eabi alone is not enough: the C library and its nano variant
      # come from libnewlib, and the linker script asks for -specs=nano.specs.
      # binutils supplies objcopy and size, which the toolchain file requires.
      - name: Install the cross toolchain and a generator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            ninja-build
          arm-none-eabi-gcc --version
          ninja --version

      - name: Configure
        run: |
          cmake -B build-fw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # Verbose, because the first failure of a build nobody has ever run is worth
      # reading in full rather than guessing at from a summary.
      - name: Build
        run: cmake --build build-fw --verbose

      # The sizes, which P12's size gate reads. Printed here so the first real
      # flash figures for this part exist in a log before anybody quotes one.
      - name: Sizes, which are the first real flash figures for this part
        run: |
          set -e
          for elf in build-fw/*.elf; do
            echo "=== $elf"
            arm-none-eabi-size -A "$elf"
          done

      # A .bin per target, which is the whole point: drag one onto the probe's
      # mass storage disk and the board runs it. No flashing tool needed.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            build-fw/*.bin
            build-fw/*.elf
            build-fw/*.map
          if-no-files-found: error

      # The map file reconciliation P01's chapter asks for needs a map file, and
      # this is the first build that produces one. Kept as a separate step so its
      # absence is a visible failure rather than a quiet gap.
      - name: A map file exists for every target
        run: |
          set -e
          for elf in build-fw/*.elf; do
            map="${elf%.elf}.map"
            test -f "$map" || { echo "no map file for $elf"; exit 1; }
            echo "$map  $(wc -l < "$map") lines"
          done
