[package]
name = "p10-phaseledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "P10's per-phase charge ledger and its residual, against the same oracle as the C and the Python"
license = "MIT"
publish = false

# No dependencies, and no_std while computing in f64. Add, subtract, multiply,
# divide and compare are in core; abs, sqrt and log10 are not. The magnitude is
# therefore written out as a comparison, which is the second crate here to need
# that after p12-gates, and P07's crate is the second to be no_std with f64.
[dependencies]

[lints]
workspace = true

[lib]
name = "p10_phaseledger"
path = "src/lib.rs"

# One verb, because this project is one function, and the parity test drives the
# filter over the same oracle the C and the Python answer to.
[[bin]]
name = "p10-filter"
path = "src/main.rs"

# No [profile.release] here. In a workspace cargo reads profiles from the root
# Cargo.toml only and ignores a member's with a warning.
