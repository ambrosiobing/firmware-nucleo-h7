[package]
name = "p11-atparse"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "P11's line classifier, wrap-safe deadline test and backoff, against the same oracle as the C and the Python"
license = "MIT"
publish = false

# No dependencies. The classifier is prefix matching on &str, which is core, the
# deadline test is a wrapping subtraction read as signed, and the backoff is
# integer arithmetic, so the library is no_std. The filter binary beside it is
# not, because it reads stdin.
[dependencies]

# Without this the workspace's lint table is silently ignored, which is the kind
# of configuration that looks applied and is not.
[lints]
workspace = true

[lib]
name = "p11_atparse"
path = "src/lib.rs"

# The filter speaks three verbs, one per piece of the chapter that needs no
# module, and the parity test drives it beside the C and the Python.
[[bin]]
name = "p11-filter"
path = "src/main.rs"

# No [profile.release] here. In a workspace cargo reads profiles from the root
# Cargo.toml only and ignores a member's with a warning.
